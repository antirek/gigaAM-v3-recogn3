version: "2.3"

services:
  diar:
    build:
      context: ./diar
    image: gigaam-recogn2-diar:latest
    runtime: nvidia
    environment:
      HF_HOME: /data/models/hf
      TORCH_HOME: /data/models/torch
      NEMO_CACHE_DIR: /data/models/nemo
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      DIAR_MODEL: ${DIAR_MODEL:-nvidia/diar_streaming_sortformer_4spk-v2.1}
      DIAR_NEMO_PATH: ${DIAR_NEMO_PATH:-}
      DIAR_CHUNK_LEN: ${DIAR_CHUNK_LEN:-340}
      DIAR_RIGHT_CONTEXT: ${DIAR_RIGHT_CONTEXT:-40}
      DIAR_FIFO_LEN: ${DIAR_FIFO_LEN:-40}
      DIAR_UPDATE_PERIOD: ${DIAR_UPDATE_PERIOD:-340}
      DIAR_SPKCACHE_LEN: ${DIAR_SPKCACHE_LEN:-188}
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./data:/data
      - ./out:/out
    working_dir: /work

  asr:
    build:
      context: ./asr
    image: gigaam-recogn2-asr:latest
    runtime: nvidia
    environment:
      GIGAAM_CACHE: /data/models/gigaam
      GIGAAM_MODEL: ${GIGAAM_MODEL:-v3_e2e_rnnt}
      DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./data:/data
      - ./out:/out
    working_dir: /work

  llm:
    build:
      context: ./llm
    image: gigaam-recogn2-llm:latest
    runtime: nvidia
    environment:
      LLM_BACKEND: llamacpp
      LLM_FALLBACK_TO_RULES: "1"
      LLAMACPP_URL: http://llamacpp:8000/v1
      LLAMACPP_MODEL: GigaChat3.1-10B-A1.8B-q6_k
      LLAMACPP_MAX_TOKENS: "2048"
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./data:/data
      - ./out:/out
    working_dir: /work

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    runtime: nvidia
    command:
      - -m
      - /models/GigaChat3.1-10B-A1.8B-q6_K.gguf
      - --alias
      - GigaChat3.1-10B-A1.8B-q6_k
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -ngl
      - "99"
      - -c
      - "16384"
      - -np
      - "1"
      - --jinja
      - -fa
      - "on"
      - --temp
      - "0"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./data/models/llamacpp:/models:ro

  mongo:
    image: mongo:7
    # host port optional; web-api talks via docker network
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web-api:
    build:
      context: ./web/server
    image: gigaam-recogn2-web-api:latest
    environment:
      MONGODB_URI: mongodb://mongo:27017/gigaam_calls
      WEB_PORT: "3000"
      CORS_ORIGIN: ${WEB_CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      - mongo
    volumes:
      - ./out:/out:ro
    expose:
      - "3000"

  web:
    build:
      context: ./web/client
    image: gigaam-recogn2-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - web-api

volumes:
  mongo_data:

